let TERM_RE = null;
const TERM_BY = new Map();
function buildTermRe() {
  TERM_BY.clear();
  const forms = [];
  for (const t of TERMS) for (const m of (t.match || [])) { forms.push(m); TERM_BY.set(norm(m), t.id); }
  forms.sort((a, b) => b.length - a.length);

const SKIP_SEL = "a,button,kbd,mark,.term,.spoil,h1,h2,h3,h4,th,td:first-child,.chk-h,.card-f,.card-meta,.ib,.pill,.stage-chips,.agora-cards";
function linkTerms(root) {
  if (!TERM_RE) return;
  for (const box of root.querySelectorAll(".card-b, .agora")) {
    const used = new Set();
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        const p = n.parentElement;
        if (!p || p.closest(SKIP_SEL)) return NodeFilter.FILTER_REJECT;

    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {

      TERM_RE.lastIndex = 0;
      let m, last = 0, frag = null;
      while ((m = TERM_RE.exec(text))) {
        const id = TERM_BY.get(norm(m[1]));
        if (!id || used.has(id)) continue;
        used.add(id);
        frag = frag || document.createDocumentFragment();
        frag.append(text.slice(last, m.index));
        const b = document.createElement("span");

        b.setAttribute("role", "button"); b.setAttribute("tabindex", "0");
        b.setAttribute("aria-label", m[1] + ": " + T("seeDef"));

        last = m.index + m[1].length;

}

  if (!pal.hidden) renderResults();
}

/* ================= progresso na conta (db) ================= */
const cloud = { ref: null, readonly: false, busy: false, again: false, retried: false, timer: null };
const SYNC_TXT_EN = {
  local: ["device", "Progress saved in this browser"], none: ["device", "Progress isn't saved in this view"], connecting: ["cloud", "Connecting to your account…"],
  cloud: ["cloud", "Progress saved to your account: works on phone and computer"], slow: ["device", "Your account hasn't answered yet. Saved in this browser for now"],
  readonly: ["device", "No permission to save to your account. Saved in this browser"], error: ["device", "Couldn't save to your account right now. Saved in this browser"],
};
let syncKey = "local";
const SYNC_TXT = {
  local: ["device", "Progresso salvo neste navegador"],
  none: ["device", "O progresso não fica salvo nesta visualização"],
  connecting: ["cloud", "Conectando à sua conta…"],
  cloud: ["cloud", "Progresso salvo na sua conta: vale no celular e no computador"],
  slow: ["device", "A conta ainda não respondeu. Por enquanto, salvo neste navegador"],
  readonly: ["device", "Sem permissão para salvar na conta. Salvo neste navegador"],
  error: ["device", "Não deu para salvar na conta agora. Salvo neste navegador"],
};
function setSync(k) {
  if ((k === "local" || k === "slow" || k === "readonly" || k === "error") && !lsOK) k = "none";
  syncKey = k;
  const tb = state.wl === "en" ? SYNC_TXT_EN : SYNC_TXT;
  const [ic, txt] = tb[k] || tb.local;
  $("#sync").innerHTML = `<svg class="i" aria-hidden="true"><use href="#i-${ic}"/></svg><span>${esc(txt)}</span>`;
}
function scheduleCloud() {
  if (!cloud.ref || cloud.readonly) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (!cloud.ref || cloud.readonly) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true;
  try {
    await cloud.ref.set({ state: JSON.parse(JSON.stringify(state)) });
    cloud.retried = false;
    setSync("cloud");
  } catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") { cloud.readonly = true; setSync("readonly"); }
    else if (code === "unavailable" && !cloud.retried) { cloud.retried = true; setTimeout(scheduleCloud, 1500 + Math.random() * 2000); }
    else if (["revoked", "not_granted", "capability_disabled", "capability_removed"].includes(code)) { cloud.ref = null; setSync("local"); }
    else setSync("error");
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; scheduleCloud(); }
  }
}
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") { setSync("local"); return; }
  setSync("connecting");
  let user = null, db = null;
  try { user = await window.claude.use("user"); } catch (e) { user = null; }
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!user || !db) { setSync("local"); return; }
  let uid = null;
  try { uid = await user.id(); } catch (e) { uid = null; }
  if (!uid) { setSync("local"); return; }
  try { cloud.ref = db.doc("data/users/" + uid + "/guia-gta6"); } catch (e) { cloud.ref = null; setSync("local"); return; }
  let confirmed = false;
  const timer = setTimeout(() => { if (!confirmed) setSync("slow"); }, 10000);
  cloud.ref.onSnapshot((snap) => {
    if (!snap.metadata.fromCache && !confirmed) { confirmed = true; clearTimeout(timer); }
    const data = snap.exists ? snap.data() : null;
    const rs = data && isObj(data.state) ? data.state : null;
    if (rs && typeof rs.t === "number") {
      if (rs.t > state.t) {
        state = normalizeState(rs);
        lsSet(); applyPrefs(); renderNav(); updateProgress(); rerender();
      } else if (rs.t < state.t && confirmed && !snap.metadata.hasPendingWrites) scheduleCloud();
    } else if (confirmed && state.t > 0) scheduleCloud();
    if (confirmed && !cloud.readonly) setSync("cloud");
  }, () => { clearTimeout(timer); cloud.ref = null; setSync("local"); });
}

/* ================= eventos ================= */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const res = t.closest("a.res");
  if (res) { e.preventDefault(); const id = palItems[+res.dataset.res]; closePalette(); if (id) go(id); return; }
  const a = t.closest('a[href^="#"]');
  if (a && !a.classList.contains("skip")) {
    const id = a.getAttribute("href").slice(1);
    if (id) { e.preventDefault(); if (!pal.hidden) closePalette(); hidePop(); go(id); return; }
  }
  if (t.closest("#side-search, #tb-search, [data-open-search]")) { openPalette(); return; }
  const term = t.closest(".term");
  if (term) { e.preventDefault(); if (popFor === term) hidePop(); else showPop(term); return; }
  if (!t.closest("#pop")) hidePop();
  const wlb = t.closest("[data-wl]");
  if (wlb) { e.preventDefault(); setLang(wlb.dataset.wl === "en" ? "en" : "pt"); return; }
  const sp = t.closest(".spoil");
  if (sp) { e.preventDefault(); sp.classList.toggle("shown"); return; }
  const fav = t.closest("[data-fav]");
  if (fav) { toggleFav(fav.dataset.fav); return; }
  const cp = t.closest("[data-copy]");
  if (cp) { copyCard(cp.dataset.copy); return; }
  const ex = t.closest("[data-exp]");
  if (ex) { const card = ex.closest(".card"); const open = card.classList.toggle("open"); ex.setAttribute("aria-expanded", String(open)); return; }
  const f = t.closest(".filters [data-f]");
  if (f) { filt[f.dataset.f] = f.dataset.v; applyFilters(); return; }
  const stg = t.closest("[data-stage]");
  if (stg) { setStage(stg.dataset.stage); return; }
  const rs = t.closest("[data-reset]");
  if (rs) { resetChk(rs.dataset.reset); return; }
  const th = t.closest(".th-sort");
  if (th) { sortTable(th); return; }
  const pl = t.closest("[data-setplat]");
  if (pl) { state.plat = pl.dataset.setplat === "xbox" ? "xbox" : "ps"; commit(); applyPrefs(); buildIndex(); return; }
  if (fstate) {
    const fe = t.closest("[data-fe]"); if (fe) { fstate.estado = fe.dataset.fe; updateFuga(); return; }
    const fn = t.closest("[data-fn]"); if (fn) { fstate.nivel = +fn.dataset.fn; updateFuga(); return; }
    const fh = t.closest("[data-fh]"); if (fh) { const k = fh.dataset.fh; fstate.heat.has(k) ? fstate.heat.delete(k) : fstate.heat.add(k); updateFuga(); return; }
    const fc = t.closest("[data-fc]"); if (fc) { const k = fc.dataset.fc; fstate.ctx.has(k) ? fstate.ctx.delete(k) : fstate.ctx.add(k); updateFuga(); return; }
  }
  const sug = t.closest("[data-sug]");
  if (sug) { q.value = sug.dataset.sug; renderResults(); q.focus(); return; }
  if (t.closest("#ask-go")) { startAsk(q.value.trim()); return; }
  if (t.closest("#ask-stop")) { if (askCtl) askCtl.abort(); return; }
  if (t.closest("#pal-close") || t === pal) { closePalette(); return; }
  if (t.closest("#menu-btn")) { toggleDrawer(); return; }
  if (t.id === "scrim") { closeDrawer(); return; }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches && t.matches("input[data-k]")) {
    const k = t.dataset.k;
    if (t.checked) state.checks[k] = true; else delete state.checks[k];
    commit(); updateChk(t.closest(".chk")); updateProgress();
    return;
  }
  if (t.id === "pref-spoiler") { state.spoiler = t.checked; commit(); applyPrefs(); return; }
  if (t.id === "pref-compact") { state.compact = t.checked; commit(); applyPrefs(); return; }
  if (t.id === "stage-sel") { setStage(t.value); return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { renderResults(); return; }
  if (t.id === "glos-f") { filterGlossary(t.value); return; }
  if (t.matches && t.matches("[data-tblf]")) {
    const wrap = t.closest(".tbl-wrap");
    const toks = tokens(t.value);
    let n = 0;
    for (const tr of $$("tbody tr", wrap)) {
      const txt = norm(tr.textContent);
      const ok = !toks.length || toks.every((w) => (SYN.get(w) || [w]).some((a) => txt.includes(a)));
      tr.hidden = !ok;
      if (ok) n++;
    }
    $(".tbl-empty", wrap).hidden = n > 0;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!pal.hidden) { e.preventDefault(); closePalette(); return; }
    if (!pop.hidden) { if (popFor) popFor.focus(); hidePop(); return; }
    closeDrawer();
    return;
  }
  const ae = document.activeElement;
  const typing = ae && ((ae.tagName === "INPUT" && /^(text|search|email|number|url|tel|password)$/i.test(ae.type)) || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT" || ae.isContentEditable);
  if (!typing && pal.hidden && (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"))) { e.preventDefault(); openPalette(); return; }
  if ((e.key === "Enter" || e.key === " ") && ae && ae.classList && ae.classList.contains("spoil")) { e.preventDefault(); ae.classList.toggle("shown"); }
  if ((e.key === "Enter" || e.key === " ") && ae && ae.classList && ae.classList.contains("term")) { e.preventDefault(); if (popFor === ae) hidePop(); else showPop(ae); }
});
window.addEventListener("scroll", () => { if (!pop.hidden) hidePop(); }, { passive: true });
window.addEventListener("resize", () => { if (!pop.hidden) hidePop(); });

function applyStatic() {
  html.lang = state.wl === "en" ? "en" : "pt-BR";
  document.title = T("brand");
  for (const el of $$("[data-i18n]")) el.textContent = T(el.dataset.i18n);
  for (const el of $$("[data-i18n-aria]")) el.setAttribute("aria-label", T(el.dataset.i18nAria));
  for (const el of $$("[data-i18n-ph]")) el.setAttribute("placeholder", T(el.dataset.i18nPh));
  $("#search-lbl").textContent = html.classList.contains("can-ask") ? T("searchAsk") : T("search");
  $("#pal .pal-box").setAttribute("aria-label", T("search"));
  $("#q").setAttribute("aria-label", T("search"));
  if (META.updated) $("#brand-s").textContent = T("updatedOn", fmtDate(META.updated));
  $("#stage-sel").innerHTML = STAGES.map((s) => `<option value="${s.id}">${esc(s.label)}</option>`).join("");
  $("#stage-sel").value = state.stage;
  renderSugs();
  setSync(syncKey);
}
function setLang(l) {
  if (state.wl === l) return;
  state.wl = l; commit();
  buildData(); buildIndex(); buildTermRe(); fstate = null;
  applyStatic(); applyPrefs(); renderNav(); updateProgress();
  if (!pal.hidden) renderResults();
  const openHow = $$("details.how[open]").map((d) => d.dataset.how);
  const anchor = document.activeElement && document.activeElement.closest ? document.activeElement.closest("details.how") : null;
  if (current) rerender();
  for (const k of openHow) { const d = document.querySelector(`details.how[data-how="${CSS.escape(k)}"]`); if (d) d.open = true; }
  if (anchor) { const d = document.querySelector(`details.how[data-how="${CSS.escape(anchor.dataset.how)}"]`); if (d) d.scrollIntoView({ block: "start" }); }
}
/* ================= início ================= */
async function init() {
  applyPrefs();
  applyStatic();
  setSync("local");
  try {
    await loadData();
  } catch (e) {
    $("#view").innerHTML = `<div class="err"><h1>${T("loadFailT")}</h1><p>${T("loadFailB")}</p><button type="button" class="chip" id="retry">${T("retry")}</button></div>`;
    $("#retry").addEventListener("click", () => location.reload());
    return;
  }
  buildIndex();
  buildTermRe();
  applyStatic();
  applyPrefs();
  renderNav();
  updateProgress();
  const first = decodeURIComponent(location.hash.slice(1));
  if ((CARD[first] || /^termo-/.test(first)) && document.fonts && document.fonts.load) {
    const fonts = Promise.all(['400 16px "Atkinson Hyperlegible"', '700 16px "Atkinson Hyperlegible"', '800 40px "Big Shoulders Display"'].map((f) => document.fonts.load(f).catch(() => null)));
    await Promise.race([fonts, new Promise((r) => setTimeout(r, 1500))]);
  }
  route(first, true);
  if ((CARD[first] || /^termo-/.test(first)) && document.fonts && document.fonts.ready) {
    const y0 = window.scrollY;
    document.fonts.ready.then(() => {
      const el = document.getElementById(first);
      if (el && Math.abs(window.scrollY - y0) < 4) el.scrollIntoView({ block: "start" });
    });
  }
  initCloud();
  initAsk();
}
init();
})();
